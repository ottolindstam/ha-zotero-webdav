server.modules = ( "mod_auth", "mod_authn_file", "mod_webdav" )
server.bind = "0.0.0.0"
server.port = 8080
server.document-root = "/data/attachments"
server.pid-file = "/data/state/lighttpd.pid"
server.upload-dirs = ( "/data/tmp" )
server.max-request-size = 1048576
server.max-connections = 32
server.max-read-idle = 60
server.max-write-idle = 360
server.follow-symlink = "disable"
server.tag = "WebDAV"
static-file.exclude-extensions = ()
mimetype.assign = ( ".zip" => "application/zip", ".prop" => "application/octet-stream", "" => "application/octet-stream" )
auth.backend = "htpasswd"
auth.backend.htpasswd.userfile = "/run/zotero/users"
auth.require = ( "/" => ( "method" => "basic", "realm" => "Zotero WebDAV", "require" => "valid-user" ) )
webdav.activate = "enable"
webdav.is-readonly = "disable"
webdav.sqlite-db-name = "/data/state/webdav.sqlite"
